<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1b1d20">
  <title>Saha Kiti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap&subset=latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="/kit/kit.css">
</head>
<body>
  <main class="kit">
    <header class="kit__head">
      <h1>Saha kiti</h1>
      <p>Dükkanın adını ve telefonunu gir. Demolar o dükkanın adıyla açılır. Ustaya seçim yaptırmak için vitrin QR'ını göster.</p>
    </header>

    <form class="kit__form" id="form" autocomplete="off">
      <label>Dükkan adı
        <input name="ad" placeholder="Örn. Yıldız Oto Elektrik" enterkeyhint="next">
      </label>
      <div class="kit__row">
        <label>Telefon
          <input name="tel" type="tel" inputmode="tel" placeholder="0532 123 45 67" enterkeyhint="next">
        </label>
        <label>Kuruluş yılı
          <input name="kurulus" inputmode="numeric" maxlength="4" placeholder="1998" enterkeyhint="done">
        </label>
      </div>
      <button type="button" class="kit__vitrin" data-vitrin>Ustaya vitrin QR'ını göster</button>
      <button type="reset" class="kit__clear">Temizle</button>
    </form>

    <div id="list"></div>
  </main>

  <dialog class="qr" id="qr">
    <p class="qr__title"></p>
    <canvas></canvas>
    <p class="qr__hint">Usta kendi telefonunun kamerasıyla okutsun.</p>
    <button type="button" data-close>Kapat</button>
  </dialog>

  <script type="module" src="/kit/kit.js"></script>
</body>
</html>
