<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d0c" />
  <title>Dizel Enjektör ve Yakıt Pompası | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d0c'/%3E%3Cpath d='M13 4h6v12l-2 5h-2l-2-5z' fill='%23c3c8cd'/%3E%3Cpath d='M16 22 L8 30 M16 22 L16 31 M16 22 L24 30' stroke='%23f5a524' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@500;700;800&family=Geist:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- 3D: havada püskürten common rail enjektör. Künyenin arkasında durur; Hizmetler'de her hizmete gelince
       ilgili plan gösterilir (söküm, test tezgâhı, kodlama). Etiketler parça adıdır. -->
  <canvas class="stage" data-stage aria-hidden="true"></canvas>
  <svg class="tags" aria-hidden="true" data-tags></svg>

  <header class="top" id="top"></header>

  <main>
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    <!-- Buradan sonra 3D kararır; normal site bölümleri. -->
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
