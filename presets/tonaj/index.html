<html lang="tr">
<head>
  <meta charset="utf-8" />

<body>
  <!-- 3D çekici iki yerde: künyenin arkasında ve Hizmetler boyunca (her hizmette ilgili parça). Sonra sahne kararır. -->
  <canvas class="stage" data-stage aria-hidden="true"></canvas>

  <header class="top" id="top"></header>

  <main>
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <section class="tour" id="hizmetler" aria-labelledby="hizmet-t"></section>
    <div class="tape solid" aria-hidden="true"></div>
    <section class="about solid" id="hakkinda" aria-labelledby="hakkinda-t"></section>
    <section class="shop solid" id="saatler" aria-labelledby="saatler-t"></section>
    <section class="reviews solid" id="yorumlar" aria-labelledby="yorum-t"></section>
    <section class="contact solid" id="iletisim" aria-labelledby="iletisim-t"></section>
  </main>

  <footer class="foot solid" id="foot"></footer>

  <script type="module" src="./main.js"></script>
