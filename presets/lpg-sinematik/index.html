<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04061a" />
  <meta name="description" content="" />
  <title>LPG Dönüşüm | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%232447ff' stroke-width='6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;900&family=Commissioner:wght@400;500;600;700&family=Sometype+Mono:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <!-- Arka plan rengi hizmetten hizmete değişir (gece laciverti, buz, emniyet sarısı, alev mavisi).
       3D LPG sistemi künyenin ve Hizmetler'in arkasında; Hizmetler'den sonra çizimi durur. -->
  <div class="backdrop" data-backdrop aria-hidden="true"></div>
  <canvas class="stage" id="gl" aria-hidden="true"></canvas>

  <header class="top" id="top"></header>

  <main>
    <div class="film" id="film">
      <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
      <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    </div>
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
