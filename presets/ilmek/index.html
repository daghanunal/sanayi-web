<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d5a45" />
  <title>Oto Döşeme | Şaşmaz, Ankara</title>
  <meta name="description" content="" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231d5a45%22/%3E%3Cpath d=%22M3 8h10%22 stroke=%22%23e2402f%22 stroke-width=%222%22 stroke-dasharray=%222 1.5%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500..800&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="/img/ilmek/tex-beyaz.jpg" />
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__tape"><div class="intro__ticks"></div></div>
    <p class="intro__count"><span>0</span> cm</p>
  </div>

  <header class="top" id="top">
    <a class="top__brand" href="#hero" data-bind="ad"></a>
    <nav class="top__nav" aria-label="Bölümler">
      <a href="#kartela">Kartela</a>
      <a href="#hizmetler">Hizmetler</a>
      <a href="#tarihce">Hikâyemiz</a>
      <a href="#iletisim">Ulaşım</a>
    </nav>
    <span class="top__status" data-status></span>
    <a class="top__call" data-tel></a>
  </header>

  <main>
    <section class="hero mat" id="hero"></section>
    <section class="about paper" id="hakkimizda"></section>
    <section class="deck mat" id="kartela"></section>
    <section class="quilt paper" id="desen"></section>
    <section class="pattern paper" id="kalip"></section>
    <section class="services mat" id="hizmetler"></section>
    <section class="tape-sec paper" id="rakamlar"></section>
    <section class="story" id="tarihce"></section>
    <section class="ribbon" id="markalar" aria-label="Çalıştığımız markalar"></section>
    <section class="tags paper" id="yorumlar"></section>
    <section class="visit mat" id="iletisim"></section>
    <section class="finale paper" id="randevu"></section>
  </main>

  <footer class="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
