<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Ağır Vasıta Servisi | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23ffac4a'/%3E%3Cpath d='M8 26 L14 17 H18 L24 26Z' fill='%23ffac4a' opacity='.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700;800;900&family=Red+Hat+Mono:wght@500;700&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <header class="top" id="top"></header>

  <main>
    <!-- Künye: arkada gece otoyolunda sodyum lambaların altından geçen 3D tır. 3D yalnız burada. -->
    <section class="hero" id="kunye" aria-labelledby="hero-title">
      <canvas class="stage" data-stage aria-hidden="true"></canvas>
      <div class="hero__shade" aria-hidden="true"></div>
      <div class="hero__in" id="kunye-ic"></div>
    </section>
    <section class="exits" id="hizmetler" aria-labelledby="hizmet-t"></section>
    <section class="about" id="hakkinda" aria-labelledby="hakkinda-t"></section>
    <section class="hours" id="saatler" aria-labelledby="saatler-t"></section>
    <section class="radio" id="yorumlar" aria-labelledby="yorum-t"></section>
    <section class="final" id="iletisim" aria-labelledby="final-t"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
