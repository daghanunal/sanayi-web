<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0f" />
  <title>Motor ve Mekanik | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0d0f'/%3E%3Crect x='10' y='7' width='12' height='12' rx='2' fill='none' stroke='%23ff5a1f' stroke-width='3'/%3E%3Cpath d='M16 19v7' stroke='%23ff5a1f' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Chivo:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas class="stage" aria-hidden="true"></canvas>
  <div class="stage-shade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Hizmetlerde 3D parçaya bağlı etiket: parçanın adı -->
  <div class="callout" aria-hidden="true">
    <svg class="callout__line"><line x1="0" y1="0" x2="0" y2="0" /></svg>
    <span class="callout__dot"></span>
    <span class="callout__label"></span>
  </div>

  <header class="top" id="top"></header>

  <main>
    <!-- 3D iki yerde: (1) künyenin arkasında rölantideki motor, (2) Hizmetler'de motor açılır ve her
         hizmette kamera ilgili parçaya gider. Hizmetlerden sonra sahne kararır, çizim durur. -->
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <section class="parts" id="hizmetler" aria-labelledby="parts-h"></section>
    <section class="about" id="hakkinda" aria-labelledby="about-h"></section>
    <section class="visit" id="saatler" aria-labelledby="visit-h"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="rev-h"></section>
    <section class="finale" id="iletisim" aria-labelledby="final-h"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
