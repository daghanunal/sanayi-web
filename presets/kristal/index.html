<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dfe8ee" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%230b1820%27/%3E%3Cpath fill=%27%239fd9cf%27 d=%27M4 17 7 6h10l3 11z%27/%3E%3C/svg%3E" />
    <title>Oto Cam | Şaşmaz, Ankara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:slnt,wght,CRSV,SHRP@-12..0,100..900,0..1,0..100&display=swap" />
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>

    <div class="intro" id="intro" role="presentation">
      <canvas class="intro__fog" id="fog"></canvas>
    </div>

    <header class="top" id="top"></header>

    <main>
      <!-- Künye; arkada ön cam (3D), açılışta üstünden bir kez parlama geçer. -->
      <section class="hero" id="sahne" aria-labelledby="hero-title"></section>
      <!-- Hizmetler: her hizmete gelince camda ilgili iş gösterilir (taş izi, değişim, yan cam, film, kamera). -->
      <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
      <!-- Buradan sonra 3D çizilmez; düz site bölümleri. -->
      <div class="solid">
        <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
        <section class="visit" id="saatler" aria-labelledby="visit-title"></section>
        <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
        <section class="finale" id="iletisim" aria-labelledby="final-title"></section>
      </div>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
