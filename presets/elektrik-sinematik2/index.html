<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#081a17" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23081a17%27/%3E%3Cpath d=%27M6 7h12M6 10h12M6 13h12M6 16h12%27 stroke=%27%23e0894c%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
    <title>Oto Elektrik | Şaşmaz, Ankara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@500..800&family=Manrope:wght@400..800&family=Spline+Sans+Mono:wght@400;600&display=swap&subset=latin-ext"
    />
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <!-- Açılış: tel bobine sarılır, sayaç döner, kamera bobinin içinden sahneye girer. -->
    <div class="intro" id="intro" role="presentation">
      <svg class="intro__coil" viewBox="-160 -160 320 320" aria-hidden="true">
        <path id="intro-spiral" d="" />
      </svg>
      <div class="intro__center">
        <p class="intro__count mono"><b id="intro-count">000</b> sarım</p>
        <p class="intro__name" id="intro-name"></p>
      </div>
      <p class="intro__skip mono">Geçmek için dokunun</p>
    </div>

    <header class="top" id="top"></header>

    <main id="film">
      <section class="hero" id="basla" aria-labelledby="hero-title"></section>
      <div class="stage stage--wind" aria-hidden="true"><p class="stage__cap" data-cap></p></div>
      <section class="blk about" id="hakkimizda" aria-labelledby="about-title"></section>
      <div class="stage stage--field" aria-hidden="true"><p class="stage__cap" data-cap></p></div>
      <section class="blk services" id="hizmetler" aria-labelledby="services-title"></section>
      <section class="faults" id="ariza" aria-labelledby="faults-title"></section>
      <section class="blk process" id="surec" aria-labelledby="process-title"></section>
      <section class="blk reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
      <section class="brands" id="markalar" aria-label="Çalıştığımız markalar"></section>
      <section class="blk shop" id="dukkan" aria-labelledby="shop-title"></section>
      <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
