<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%2307060d%27/%3E%3Cpath fill=%27none%27 stroke=%27%23fff%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27 d=%27M12 4 20 19H4z%27/%3E%3Cpath stroke=%27%23ff4d8d%27 stroke-width=%271.6%27 d=%27M15 12l7-2%27/%3E%3Cpath stroke=%27%233dd6ff%27 stroke-width=%271.6%27 d=%27M15 13l7 2%27/%3E%3C/svg%3E" />
    <title>Oto Cam | Şaşmaz, Ankara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..800&family=Onest:wght@400..700&display=swap&subset=latin-ext" />
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="labels" id="labels" aria-hidden="true"></div>

    <div class="intro" id="intro" role="presentation">
      <svg class="intro__svg" id="intro-svg" aria-hidden="true"></svg>
      <div class="intro__name" id="intro-name"></div>
      <p class="intro__skip">Geçmek için dokunun</p>
    </div>

    <header class="top" id="top"></header>

    <main>
      <div class="film" id="film">
        <section class="scene" data-scene="hero" id="sahne" style="--len: 2" aria-labelledby="hero-title"></section>
        <section class="scene" data-scene="katman" id="katman" style="--len: 2.8" aria-labelledby="katman-title"></section>
        <section class="scene" data-scene="tas" id="tas" style="--len: 3" aria-labelledby="tas-title"></section>
        <section class="scene" data-scene="recine" id="recine" style="--len: 2.8" aria-labelledby="recine-title"></section>
        <section class="scene" data-scene="film" id="cam-filmi" style="--len: 2.8" aria-labelledby="film-title"></section>
        <section class="scene" data-scene="adas" id="kalibrasyon" style="--len: 2.6" aria-labelledby="adas-title"></section>
      </div>
      <div class="solid" id="solid">
        <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
        <section class="process" id="kasko" aria-labelledby="process-title"></section>
        <section class="about" id="biz" aria-labelledby="about-title"></section>
        <section class="shop" id="atolye" aria-labelledby="shop-title"></section>
        <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
        <section class="brands" id="markalar" aria-label="Camını taktığımız markalar"></section>
        <section class="visit" id="ulasim" aria-labelledby="visit-title"></section>
      </div>
      <section class="scene scene--final" data-scene="final" id="iletisim" style="--len: 2" aria-labelledby="final-title"></section>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
