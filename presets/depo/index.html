<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15191e" />
  <title>Oto Yedek Parça | Şaşmaz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ee6a24'/%3E%3Cpath d='M7 9h2v14H7zm4 0h1v14h-1zm3 0h3v14h-3zm5 0h1v14h-1zm3 0h3v14h-3z' fill='%2316171a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas class="stage" data-stage aria-hidden="true"></canvas>

  <header class="top" id="top"></header>

  <main>
    <!-- Künye: depo koridorunun girişi (3D). Kaydırınca kamera koridora yürür. -->
    <section class="ch ch--hero" data-ch="hero" id="kunye" aria-labelledby="hero-title"></section>
    <!-- Hizmetler: düz bölüm; ardından parça grupları. Her grupta koridordaki kutu raftan çıkar, açılır,
         parça yükselir (3D, pin yok: kartlar akışta kayar). -->
    <section class="sec hizmetler" id="hizmetler" aria-labelledby="hizmet-title"></section>
    <section class="gruplar" data-ch="raf" id="parca-gruplari" aria-labelledby="grup-title"></section>
    <!-- Buradan sonra 3D durur; düz site bölümleri. -->
    <section class="sec hakkinda" id="hakkinda" aria-labelledby="hakkinda-title"></section>
    <section class="sec ziyaret" id="saatler" aria-labelledby="saat-title"></section>
    <section class="sec yorumlar" id="yorumlar" aria-labelledby="yorum-title"></section>
    <section class="sec final" id="iletisim" aria-labelledby="final-title"></section>
  </main>
  <footer class="footer" id="footer"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
