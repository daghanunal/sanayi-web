<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121519" />
  <title>Turbo Revizyonu | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121519'/%3E%3Cpath d='M16 16m-2 0a2 2 0 1 0 4 0a4 4 0 1 0-8 0a6 6 0 1 0 12 0a8 8 0 1 0-16 0' fill='none' stroke='%23b98cff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Libre+Franklin:wght@400;500;600&family=Ubuntu+Sans+Mono:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet" />
  <link rel="preload" as="image" href="/img/turbo-klasik/giris-m.jpg" media="(max-width: 899px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/img/turbo-klasik/giris-d.jpg" media="(min-width: 900px)" fetchpriority="high" />
</head>
<body>
  <header class="top" id="top"></header>

  <main>
    <!-- Künye: tezgâhtaki turbonun fotoğrafı üstünde ad, iş, adres, bugünkü saatler. Açılışta salyangoz
         sarmalı turbonun ağzında bir kez çizilir (süs). -->
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <!-- Hizmetler: yanında parçalarına ayrılmış turbo çizimi; etkin hizmetin parçası işaretlenir. -->
    <section class="hizmet" id="hizmetler" aria-labelledby="hizmet-h"></section>
    <section class="atolye" id="hakkinda" aria-labelledby="atolye-h"></section>
    <section class="konum" id="saatler" aria-labelledby="konum-h"></section>
    <section class="yorum" id="yorumlar" aria-labelledby="yorum-h"></section>
    <section class="final" id="iletisim" aria-labelledby="final-h"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="isil" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f1b544" />
        <stop offset=".35" stop-color="#d4692c" />
        <stop offset=".7" stop-color="#8b44c4" />
        <stop offset="1" stop-color="#3a6bea" />
      </linearGradient>
    </defs>
  </svg>

  <script type="module" src="./main.js"></script>
</body>
</html>
