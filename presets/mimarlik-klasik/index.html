<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16302a" />
  <title>Mimarlık Ofisi | Etimesgut, Ankara</title>
  <meta name="description" content="Mimarlık ofisi: hizmetler, çalışma sırası, çalışma saatleri, adres ve yol tarifi." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316302a'/%3E%3Cpath d='M10 27V11a6 6 0 0 1 12 0v16' fill='none' stroke='%23d0a857' stroke-width='2.4'/%3E%3Cpath d='M5 27h22' stroke='%23eeede6' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Gantari:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="/img/mimarlik-klasik/yemek-odasi.webp" fetchpriority="high" />
  <script type="application/ld+json"></script>
</head>
<body>
  <header class="top" id="ust"></header>

  <main>
    <!-- Künye: koyu çam yeşili sıva duvarda tek bir kemerli kapı boşluğu; boşluktan aydınlık bir oda görünür.
         Kapı açılışta bir kez açılır (~1 sn), kaydırma kilitlenmez. -->
    <section class="hero" id="top" aria-labelledby="hero-ad">
      <div class="hero__room" aria-hidden="true">
        <img class="hero__photo" src="/img/mimarlik-klasik/yemek-odasi.webp" alt="" fetchpriority="high" decoding="async" width="2400" height="1602" />
      </div>
      <svg class="hero__wall" aria-hidden="true">
        <defs>
          <radialGradient id="duvar" cx="50%" cy="62%" r="75%">
            <stop offset="0" stop-color="#21443a" />
            <stop offset=".55" stop-color="#17322b" />
            <stop offset="1" stop-color="#0f231e" />
          </radialGradient>
          <linearGradient id="isik" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3e2b8" stop-opacity=".34" />
            <stop offset="1" stop-color="#f3e2b8" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path class="hero__wallpath" data-wallpath fill="url(#duvar)" fill-rule="evenodd" />
        <path class="hero__spill" data-spill fill="url(#isik)" />
        <path class="hero__kasa" data-kasa />
        <path class="hero__floor" data-floor />
      </svg>
      <div class="hero__copy" id="kunye"></div>
      <p class="hero__olcu" data-olcu aria-hidden="true"><span></span><em>1,10 × 2,40 · görsel temsilî</em></p>
    </section>

    <section class="odalar" id="hizmetler" aria-labelledby="oda-h"></section>
    <section class="surec" aria-labelledby="surec-h"></section>
    <section class="ofis" id="hakkinda" aria-labelledby="ofis-h"></section>
    <section class="konum" id="saatler" aria-labelledby="konum-h"></section>
    <section class="yorum" id="yorumlar" aria-labelledby="yorum-h"></section>
    <section class="program" id="iletisim" aria-labelledby="iletisim-h"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
