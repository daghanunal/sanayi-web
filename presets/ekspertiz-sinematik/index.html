<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c12" />
  <title>Oto Ekspertiz | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c12'/%3E%3Crect x='7' y='6' width='18' height='20' rx='5' fill='none' stroke='%231ed69b' stroke-width='2.5'/%3E%3Cpath d='M4 16h24' stroke='%23ffb627' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@500;700;800;900&family=Host+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <!-- 3D ekspertiz bölmesi iki yerde: künyenin arkasında (araç bölmede) ve Hizmetler'de (her hizmette kamera ilgili
       yere gider: tarama kapısı, lift, OBD cihazı, kaput, ön takım, dinamometre, kuşbakışı renk şeması).
       Hizmetler'den sonra çizim durur; gerisi rapor kâğıdı renginde düz site bölümleri. -->
  <canvas class="stage" id="gl" aria-hidden="true"></canvas>
  <div class="loader" data-loader aria-hidden="true"><i></i><span>Yükleniyor</span></div>
  <div class="tag" data-tag aria-hidden="true"><i></i><span data-tag-t></span></div>

  <header class="top" id="top"></header>

  <main>
    <div class="film" id="film">
      <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
      <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    </div>
    <div class="paper">
      <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
      <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
      <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    </div>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
