<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1630e8" />
  <title>Motor ve Mekanik | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231630e8'/%3E%3Cpath d='M5 25 C11 24 13 9 18 8 S25 14 27 20' fill='none' stroke='%23ffe14d' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600..900&family=Sofia+Sans:wght@400..700&family=Red+Hat+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Arkada dinamometre kâğıdı: eğri kaydırdıkça çizilir (süs; sayı ya da gösterge yok). -->
  <div class="dyno" aria-hidden="true">
    <svg class="dyno__svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <path class="dyno__hp" pathLength="1" vector-effect="non-scaling-stroke" />
      <path class="dyno__tq" pathLength="1" vector-effect="non-scaling-stroke" />
    </svg>
    <span class="dyno__dot"></span>
  </div>

  <header class="top" id="top"></header>

  <main>
    <!-- Künye: dükkânın adı bölünmüş kart tabelada (split-flap) bir kez döner. -->
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <section class="hizmetler" id="hizmetler" aria-labelledby="hizmetler-h"></section>
    <section class="hakkinda" id="hakkinda" aria-labelledby="hakkinda-h"></section>
    <section class="konum" id="saatler" aria-labelledby="konum-h"></section>
    <section class="yorumlar" id="yorumlar" aria-labelledby="yorumlar-h"></section>
    <section class="final" id="iletisim" aria-labelledby="final-h"></section>
  </main>

  <footer class="alt" id="alt"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
