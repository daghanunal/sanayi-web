<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%2304060b%27/%3E%3Cpath fill=%27%237fd8ff%27 d=%27M13.5 3 5 13.5h6L9.8 21 19 9.8h-6z%27/%3E%3C/svg%3E" />
    <title>Oto Elektrik | Şaşmaz, Ankara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=JetBrains+Mono:wght@400;700&display=swap" />
    <link rel="preload" href="/models/ferrari.glb" as="fetch" crossorigin />
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="tags" id="tags" aria-hidden="true"></div>
    <svg class="arc" id="arc" aria-hidden="true"></svg>
    <div class="flash" id="flash" aria-hidden="true"></div>

    <div class="intro" id="intro" role="presentation">
      <div class="intro__half intro__half--top"></div>
      <div class="intro__half intro__half--bottom"></div>
      <div class="intro__line"></div>
      <div class="intro__center">
        <div class="intro__terminals">
          <span class="intro__term" id="term-neg">−</span>
          <span class="intro__volt" id="intro-volt">00,0 V</span>
          <span class="intro__term" id="term-pos">+</span>
        </div>
        <p class="intro__name" id="intro-name"></p>
      </div>
      <p class="intro__skip">Geçmek için dokunun</p>
    </div>

    <header class="top" id="top"></header>

    <main id="film">
      <section class="scene hero" id="sahne" aria-labelledby="hero-title"></section>
      <section class="scene faults" id="arizalar" aria-labelledby="faults-title"></section>
      <section class="scene about" id="olcum" aria-labelledby="about-title"></section>
      <section class="scene services" id="hizmetler" aria-labelledby="services-title"></section>
      <section class="scene process" id="surec" aria-labelledby="process-title"></section>
      <section class="scene reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
      <section class="scene brands" id="markalar" aria-label="Çalıştığımız markalar"></section>
      <section class="scene shop" id="dukkan" aria-labelledby="shop-title"></section>
      <section class="scene finale" id="iletisim" aria-labelledby="finale-title"></section>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
