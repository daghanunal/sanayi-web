<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1a1f" />
  <title>Şanzıman Tamiri | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1a1f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d4ad62' stroke-width='3' stroke-dasharray='3 2.6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%233be3c3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Outfit:wght@300;400;500;600;700&family=Victor+Mono:wght@500;600&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <canvas class="stage" data-stage aria-hidden="true"></canvas>
  <div class="cursor" data-cursor aria-hidden="true"><i></i></div>

  <header class="top" data-top></header>

  <main>
    <!-- 3D iki yerde: (1) açılış, şanzıman kutusunun kapağı bir kez aralanır; (2) Hizmetler, her hizmette kamera
         ilgili parçaya gider, kartın etiketi parça adıdır. Hizmetlerden sonra sahne kararır ve çizim durur. -->
    <section class="film" data-film>
      <div class="film__hero" id="kunye">
        <div class="hero" data-hero></div>
      </div>
      <div class="film__stops" id="hizmetler" data-cards></div>
    </section>

    <section class="about" id="hakkinda" aria-labelledby="about-h"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-h"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="rev-h"></section>
    <section class="finale" id="iletisim" aria-labelledby="fin-h"></section>
  </main>

  <footer class="foot" data-foot></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
