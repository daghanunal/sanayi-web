<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1d2022" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%23f29d20%27/%3E%3Cpath d=%27M7 17l5-11 5 11%27 stroke=%27%231d2022%27 stroke-width=%272.4%27 fill=%27none%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
    <title>Alçıbay | Yapı alçıları ve alçı plaka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap&subset=latin-ext" />
    <link rel="preload" as="image" href="/img/alcibay/tugla.jpg" crossorigin />
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>

    <div class="intro" id="intro" role="presentation">
      <div class="intro__in">
        <img class="intro__logo" src="/img/alcibay/logo-acik.png" alt="" width="288" height="49" />
        <p class="intro__line" id="intro-line">hızlı beyaz</p>
      </div>
      <p class="intro__skip">Geçmek için dokunun</p>
    </div>

    <header class="top" id="top"></header>

    <main id="main">
      <section class="hero" id="giris" aria-labelledby="hero-title"></section>
      <section class="wall" id="katman" aria-labelledby="wall-title"></section>
      <section class="finder" id="sec" aria-labelledby="finder-title"></section>
      <section class="range" id="urunler" aria-labelledby="range-title"></section>
      <section class="boards" id="plaka" aria-labelledby="boards-title"></section>
      <section class="chem" id="alci" aria-labelledby="chem-title"></section>
      <section class="plants" id="fabrikalar" aria-labelledby="plants-title"></section>
      <section class="final" id="iletisim" aria-labelledby="final-title"></section>
    </main>

    <footer class="foot" id="foot"></footer>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

    <script type="module" src="./main.js"></script>
  </body>
</html>
