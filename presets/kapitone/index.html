<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120c0a" />
  <title>Oto Döşeme | Şaşmaz, Ankara</title>
  <meta name="description" content="" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23120c0a%22/%3E%3Cpath d=%22M6 16h20%22 stroke=%22%23e7a33a%22 stroke-width=%223%22 stroke-dasharray=%224 3%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="intro" id="intro" role="presentation">
    <div class="intro__half intro__half--top"></div>
    <div class="intro__half intro__half--bot"></div>
    <div class="intro__center">
      <p class="intro__name" data-bind="ad"></p>
      <svg class="intro__thread" viewBox="0 0 600 20" preserveAspectRatio="none" aria-hidden="true">
        <path class="intro__guide" d="M0,10 L600,10" />
        <path class="intro__stitch" d="M0,10 L600,10" />
      </svg>
      <p class="intro__meta"><span data-bind="beri"></span><span class="intro__count">000</span></p>
    </div>
    <p class="intro__skip">Geçmek için dokunun</p>
  </div>

  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="top" id="top">
    <a class="top__brand" href="#film" data-bind="ad"></a>
    <nav class="top__nav" aria-label="Bölümler">
      <a href="#hizmetler">Hizmetler</a>
      <a href="#tarihce">Hikâyemiz</a>
      <a href="#tasarla">Koltuğunu tasarla</a>
      <a href="#iletisim">Ulaşım</a>
    </nav>
    <p class="top__status" data-status></p>
    <a class="top__call mag" data-tel></a>
  </header>

  <main>
    <section class="film" id="film">
      <div class="film__stage">
        <div class="hero" id="hero"></div>
        <div class="steps" id="adimlar"></div>
        <div class="svcs" id="hizmetler"></div>
        <div class="film__rail" aria-hidden="true"><i></i></div>
      </div>
    </section>

    <section class="her" id="tarihce">
      <div class="her__stage"></div>
    </section>

    <section class="cfg" id="tasarla"></section>

    <div class="cover">
      <section class="proof" id="yorumlar"></section>
      <section class="visit" id="iletisim"></section>
    </div>

    <section class="fin" id="son"></section>
  </main>

  <footer class="foot"></footer>

  <div class="cursor" aria-hidden="true"><i class="cursor__dot"></i><i class="cursor__ring"></i></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
