<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120c0a" />
  <title>Oto Döşeme | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23120c0a%22/%3E%3Cpath d=%22M6 16h20%22 stroke=%22%23e7a33a%22 stroke-width=%223%22 stroke-dasharray=%224 3%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@0,50..150,100..900;1,50..150,100..900&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="top" id="top">
    <div class="top__in">
      <a class="top__brand" href="#bas" data-bind="ad"></a>
      <nav class="top__nav" aria-label="Bölümler">
        <a href="#hizmetler">Hizmetler</a>
        <a href="#hakkinda">Hakkında</a>
        <a href="#saatler">Saatler ve konum</a>
        <a href="#iletisim">İletişim</a>
      </nav>
      <p class="top__status" data-status></p>
      <a class="top__call" data-tel></a>
    </div>
  </header>

  <main>
    <!-- Künye; arkada (telefonda üstte) loş atölyede 3D koltuk. -->
    <section class="hero" id="bas" aria-labelledby="hero-title"></section>
    <!-- Hizmetler: her hizmete gelince koltuk ilgili hâle geçer (sünger, alcantara, dikiş, ısıtma...). -->
    <section class="svcs" id="hizmetler" aria-labelledby="hizmetler-h"></section>
    <!-- Buradan sonra 3D durur; normal site bölümleri. -->
    <div class="cover">
      <section class="about" id="hakkinda" aria-labelledby="hakkinda-h"></section>
      <section class="visit" id="saatler" aria-labelledby="saatler-h"></section>
      <section class="proof" id="yorumlar" aria-labelledby="yorumlar-h"></section>
      <section class="fin" id="iletisim" aria-labelledby="iletisim-h"></section>
    </div>
  </main>

  <footer class="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
