<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050607" />
  <meta name="description" content="Boya, kaporta ve detaylı bakım. Şaşmaz Oto Sanayi Sitesi, Etimesgut/Ankara." />
  <title>Boya ve Kaporta | Şaşmaz, Ankara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <a class="skip" href="#hizmetler">İçeriğe geç</a>

  <div class="stage" aria-hidden="true"><canvas data-stage></canvas></div>
  <!-- 3D kabin yüklenirken sayfa kullanılabilir, yalnız sahne bekler -->
  <div class="loader" data-loader role="status" aria-live="polite">
    <span class="loader__tube"><i data-load-bar></i></span>
    <span class="loader__txt">3D kabin yükleniyor</span>
  </div>

  <header class="top" id="top"></header>

  <main>
    <!-- Künye; arkada fırınlı kabinde bir araç, açılışta kabin ışıkları bir kez titreyerek yanar. -->
    <section class="hero" id="hero" aria-labelledby="hero-title"></section>
    <!-- Hizmetler: her hizmete gelince kamera ilgili yere gider (boya, göçük, pasta, seramik, film, jant). -->
    <section class="svcs" id="hizmetler" aria-labelledby="svcs-title"></section>
    <!-- Buradan sonra 3D durur; normal site bölümleri. -->
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
    <section class="voices" id="yorumlar" aria-labelledby="voices-title"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
