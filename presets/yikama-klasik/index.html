<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3fd1" />
  <title>Oto Yıkama ve Detaylı Temizlik | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f3fd1'/%3E%3Crect x='7' y='9' width='18' height='5' rx='2.5' fill='%23ff3b5c'/%3E%3Crect x='14' y='14' width='4' height='11' rx='2' fill='%23ffc21a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Rethink+Sans:wght@400;500;600;700&family=Sometype+Mono:wght@500;600&display=swap&subset=latin-ext" rel="stylesheet" />
  <link rel="preload" as="image" href="/img/yikama-klasik/hero-kirli-dik.jpg" media="(max-width: 899px)" />
  <link rel="preload" as="image" href="/img/yikama-klasik/hero-temiz-dik.jpg" media="(max-width: 899px)" />
  <link rel="preload" as="image" href="/img/yikama-klasik/hero-kirli.jpg" media="(min-width: 900px)" />
  <link rel="preload" as="image" href="/img/yikama-klasik/hero-temiz.jpg" media="(min-width: 900px)" />
</head>
<body>
  <header class="top" id="top"></header>

  <main>
    <!-- Künye. Yanında yıkama tüneli: açılışta çamurlu araç tünelden bir kez geçer (su, fırça, köpük perdesi,
         durulama, kurutma). Kaydırmaya bağlı pin yok; katmanlar yalnız transform/opacity ile hareket eder. -->
    <section class="hero" id="kunye" aria-labelledby="hero-title">
      <div class="hero__pin">
        <div class="hero__copy" data-hero></div>
        <div class="tunel">
          <div class="tunel__sign" aria-hidden="true"><span>Yıkama</span><b>Tüneli</b></div>
          <div class="hero__stage" aria-hidden="true">
            <picture class="hero__img hero__img--temiz">
              <source media="(max-width: 899px)" srcset="/img/yikama-klasik/hero-temiz-dik.jpg" />
              <img src="/img/yikama-klasik/hero-temiz.jpg" alt="" fetchpriority="high" decoding="async" />
            </picture>
            <picture class="hero__img hero__img--kirli" data-kirli>
              <source media="(max-width: 899px)" srcset="/img/yikama-klasik/hero-kirli-dik.jpg" />
              <img src="/img/yikama-klasik/hero-kirli.jpg" alt="" fetchpriority="high" decoding="async" />
            </picture>
            <div class="su" data-su><i></i></div>
            <div class="firca firca--1" data-firca><i></i></div>
            <div class="firca firca--2" data-firca><i></i></div>
            <div class="kopuk" data-kopuk></div>
            <div class="kurut" data-kurut></div>
            <div class="parilti" data-parilti></div>
          </div>
          <ol class="istasyon mono" data-istasyon aria-hidden="true">
            <li>Su</li><li>Fırça</li><li>Köpük</li><li>Durulama</li><li>Kurutma</li>
          </ol>
        </div>
      </div>
    </section>

    <section class="prog" id="hizmetler" aria-labelledby="svc-h"></section>
    <section class="about" id="hakkinda" aria-labelledby="about-h"></section>
    <section class="konum" id="saatler" aria-labelledby="konum-h"></section>
    <section class="yorum" id="yorumlar" aria-labelledby="yorum-h"></section>
    <section class="final" id="iletisim" aria-labelledby="final-h"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
