<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e4e8ec" />
    <meta name="description" content="" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%232f7bff%27/%3E%3Cpath fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272%27 stroke-linecap=%27round%27 d=%27M5 19V7m14 12V7M5 13h14M8 10.5h8%27/%3E%3C/svg%3E" />
    <title>Genel Bakım ve Onarım | Şaşmaz, Ankara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <canvas class="tags" id="tags" aria-hidden="true"></canvas>

    <header class="top" id="top"></header>

    <main>
      <!-- Künye; arkada serviste liftteki araç. -->
      <section class="hero" id="sahne" aria-labelledby="hero-title"></section>
      <!-- Hizmetler: dört grup; her hizmette kamera aracın ilgili sistemine gider, parça yerinden çıkar. -->
      <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
      <!-- Periyodik bakım: kilometreye göre sıradaki bakım; zamanı gelen parçalar araçta işaretlenir. -->
      <section class="plan" id="bakim-plani" aria-labelledby="plan-title"></section>
      <!-- Buradan sonra 3D çizilmez; düz site bölümleri. -->
      <div class="solid" id="solid">
        <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
        <section class="visit" id="saatler" aria-labelledby="visit-title"></section>
        <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
        <section class="finale" id="iletisim" aria-labelledby="final-title"></section>
      </div>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
