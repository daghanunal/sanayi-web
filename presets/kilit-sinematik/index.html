<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0a17" />
  <meta name="description" content="" />
  <title>Oto Kilit ve Anahtar | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0a17'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23e8b04e'/%3E%3Cpath d='M13 15h6l2 11h-10z' fill='%23e8b04e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <!-- 3D kesitli kilit künyenin ve Hizmetler'in arkasında; Hizmetler'den sonra çizimi durur. -->
  <div class="sky" aria-hidden="true"></div>
  <canvas class="stage" id="gl" aria-hidden="true"></canvas>

  <header class="top" id="top"></header>

  <main>
    <div class="film" id="film">
      <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
      <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    </div>
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
