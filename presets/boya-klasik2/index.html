<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17181a" />
  <meta name="description" content="Boya, kaporta ve detaylı bakım. Şaşmaz Oto Sanayi Sitesi, Etimesgut/Ankara." />
  <title>Boya ve Kaporta | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317191b'/%3E%3Crect x='6' y='21' width='20' height='5' fill='%238e949b'/%3E%3Crect x='6' y='15' width='20' height='5' fill='%23c9cac5'/%3E%3Crect x='6' y='9' width='20' height='5' fill='%23ff4d1a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800&family=Space+Mono:wght@400;700&display=swap&subset=latin-ext" rel="stylesheet" />
  <link rel="preload" as="image" href="/img/boya-klasik2/r-kat-sac-m.webp" media="(max-width: 899px)" />
  <link rel="preload" as="image" href="/img/boya-klasik2/r-kat-sac-d.webp" media="(min-width: 900px)" />
  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <a class="skip" href="#hizmetler">İçeriğe geç</a>

  <header class="top" id="top" data-top></header>

  <main>
    <!-- Künye; yanında dört kat (sac, astar, renk, vernik) açılışta bir kez alttan üste boyanır. -->
    <section class="kat" id="hero" aria-labelledby="hero-title">
      <div class="kat__stage">
        <div class="kat__photo">
          <div class="layer layer--0"><picture><source media="(min-width: 900px)" srcset="/img/boya-klasik2/r-kat-sac-d.webp" /><img src="/img/boya-klasik2/r-kat-sac-m.webp" alt="" fetchpriority="high" /></picture></div>
          <div class="layer layer--1"><div class="layer__in"><picture><source media="(min-width: 900px)" srcset="/img/boya-klasik2/r-kat-astar-d.webp" /><img src="/img/boya-klasik2/r-kat-astar-m.webp" alt="" decoding="async" /></picture></div><span class="layer__edge"></span></div>
          <div class="layer layer--2"><div class="layer__in"><picture><source media="(min-width: 900px)" srcset="/img/boya-klasik2/r-kat-boya-d.webp" /><img src="/img/boya-klasik2/r-kat-boya-m.webp" alt="" decoding="async" /></picture></div><span class="layer__edge"></span></div>
          <div class="layer layer--3"><div class="layer__in"><picture><source media="(min-width: 900px)" srcset="/img/boya-klasik2/r-kat-vernik-d.webp" /><img src="/img/boya-klasik2/r-kat-vernik-m.webp" alt="Boya kabininde turuncu boyalı, vernikli bir otomobil (3D görsel)" decoding="async" /></picture><span class="gloss"></span></div><span class="layer__edge"></span></div>
          <div class="kat__shade" aria-hidden="true"></div>
          <ol class="kat__legend mono" aria-hidden="true"><li>Sac</li><li>Astar</li><li>Renk</li><li>Vernik</li></ol>
        </div>
        <div class="kat__panel" id="kunye"></div>
      </div>
    </section>

    <section class="hiz" id="hizmetler" aria-labelledby="hiz-title"></section>
    <section class="foy" id="hakkinda" aria-labelledby="foy-title"></section>
    <section class="konum" id="saatler" aria-labelledby="konum-title"></section>
    <section class="yorum" id="yorumlar" aria-labelledby="yorum-title"></section>
    <section class="son" id="iletisim" aria-labelledby="son-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
