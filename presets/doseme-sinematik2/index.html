<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2bdb" />
  <title>Oto Döşeme | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2bdb'/%3E%3Cpath d='M6 22 Q16 6 26 22' fill='none' stroke='%23ff8cc6' stroke-width='3' stroke-dasharray='3 2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,400..700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <header class="top">
    <a class="top__brand" href="#bas" data-bind="ad"></a>
    <nav class="top__nav" aria-label="Bölümler">
      <a href="#hizmetler">Hizmetler</a>
      <a href="#hakkinda">Hakkında</a>
      <a href="#saatler">Saatler ve konum</a>
      <a href="#iletisim">İletişim</a>
    </nav>
    <p class="top__status" data-status></p>
    <a class="top__call" data-tel><span data-icon="phone"></span><span class="top__num" data-bind="telefon"></span></a>
  </header>

  <main>
    <!-- Künye. Yanında (telefonda üstünde) stüdyo ışığında koltuk: açılışta bir kez kumaştan kapitoneye döner. 3D yalnız burada. -->
    <section class="hero" id="bas" aria-labelledby="hero-title">
      <div class="glow" aria-hidden="true"></div>
      <canvas class="stage" data-stage aria-hidden="true"></canvas>
      <p class="hero__mat" data-mat aria-hidden="true"></p>
      <div class="hero__inner" data-hero></div>
    </section>
    <section class="svc" id="hizmetler" aria-labelledby="hizmetler-h"></section>
    <section class="about" id="hakkinda" aria-labelledby="hakkinda-h"></section>
    <section class="visit" id="saatler" aria-labelledby="saatler-h"></section>
    <section class="rev" id="yorumlar" aria-labelledby="yorumlar-h"></section>
    <section class="final" id="iletisim" aria-labelledby="iletisim-h"></section>
  </main>

  <footer class="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
