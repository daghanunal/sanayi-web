<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a10" />
  <title>Turbo Revizyonu | Şaşmaz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%238fdcff' stroke-width='4'/%3E%3Cpath d='M16 4a12 12 0 0 1 12 12' fill='none' stroke='%23ff6b1c' stroke-width='4'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tomorrow:ital,wght@0,600;0,700;1,700;1,800&family=Commissioner:wght@400;500;600;700&family=Ubuntu+Sans+Mono:wght@500;600&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <!-- 3D: karanlık stüdyoda turbo. Künyenin arkasında döner; Hizmetler'de her hizmete gelince ilgili parça gösterilir. -->
  <canvas class="stage" data-stage aria-hidden="true"></canvas>
  <!-- Parça etiketleri (yalnız söküm planı): tek SVG katmanı, dokunmayı almaz -->
  <svg class="labels" data-labels aria-hidden="true"></svg>

  <header class="top" id="top"></header>

  <main>
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    <!-- Buradan sonra 3D kararır; normal site bölümleri. -->
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
