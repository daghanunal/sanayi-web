<body>

    <section class="steps" aria-labelledby="steps-h"></section>
    <section class="about" id="hakkinda" aria-labelledby="about-h"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-h"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="rev-h"></section>
    <section class="finale" id="iletisim" aria-labelledby="fin-h"></section>
