<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef0f3" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%23f2f3f5%27/%3E%3Cpath d=%27M3 6h18M3 11h18M3 16h18%27 stroke=%27%230b0b10%27 stroke-width=%272.6%27/%3E%3C/svg%3E" />
    <title>Boya ve Kaporta | Şaşmaz, Ankara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;600&display=swap" />
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="pins" id="pins" aria-hidden="true"></div>

    <div class="intro" id="intro" role="presentation">
      <canvas class="intro__zebra" id="zebra"></canvas>
      <p class="intro__name" id="intro-name"></p>
      <p class="intro__skip">Geçmek için dokunun</p>
    </div>

    <header class="top" id="top"></header>

    <main>
      <div class="film" id="film">
        <section class="scene" data-scene="hero" id="sahne" aria-labelledby="hero-title"></section>
        <section class="scene" data-scene="dolu" id="dolu" aria-labelledby="dolu-title"></section>
        <section class="scene" data-scene="kaza" id="kaza" aria-labelledby="kaza-title"></section>
        <section class="scene" data-scene="renk" id="renk" aria-labelledby="renk-title"></section>
        <section class="scene" data-scene="pasta" id="pasta" aria-labelledby="pasta-title"></section>
        <section class="scene" data-scene="seramik" id="seramik" aria-labelledby="seramik-title"></section>
      </div>
      <div class="solid" id="solid">
        <section class="proof" id="isler" aria-labelledby="proof-title"></section>
        <section class="svc" id="hizmetler" aria-labelledby="svc-title"></section>
        <section class="about" id="biz" aria-labelledby="about-title"></section>
        <section class="steps" id="surec" aria-labelledby="steps-title"></section>
        <section class="gal" id="galeri" aria-labelledby="gal-title"></section>
        <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
        <section class="visit" id="ulasim" aria-labelledby="visit-title"></section>
      </div>
      <section class="scene scene--final" data-scene="final" id="iletisim" aria-labelledby="final-title"></section>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
