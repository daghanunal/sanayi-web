<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121316" />
  <title>Lastik, Jant ve Rot-Balans | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121316'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ffd000' stroke-width='4' stroke-dasharray='3 2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23ffd000'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas class="stage" data-stage aria-hidden="true"></canvas>
  <div class="stage-shade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Hizmetlerde 3D parçaya bağlı etiket: parçanın adı -->
  <div class="callout" aria-hidden="true">
    <svg class="callout__line"><line x1="0" y1="0" x2="0" y2="0" /></svg>
    <span class="callout__dot"></span>
    <span class="callout__label"></span>
  </div>

  <header class="top" id="top"></header>

  <main>
    <!-- 3D iki yerde: (1) künyenin arkasında gece pistinde yavaş dönen teker, (2) Hizmetler'de her hizmette
         kamera ilgili parçaya gider (lastik, jant, sibop; balansta teker dengelenir). Sonra sahne kararır ve çizim durur. -->
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <section class="parts" id="hizmetler" aria-labelledby="parts-h"></section>
    <section class="about" id="hakkinda" aria-labelledby="about-h"></section>
    <section class="visit" id="saatler" aria-labelledby="visit-h"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="rev-h"></section>
    <section class="finale" id="iletisim" aria-labelledby="final-h"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
