<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1230" />
  <title>Çekici ve Yol Yardım | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1230'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffb21e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;700;800&family=Oxanium:wght@500;600;700&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <header class="top" id="top"></header>

  <main>
    <!-- Künye: gece yolu (3D, yalnız burada). Açılışta çekici bir kez gelip emniyet şeridindeki aracın önünde durur,
         kasa iner ve araç vinçle kasaya alınır (~9 sn, kaydırmaya bağlı değil). Künye yolun önünde durur. -->
    <section class="hero" id="kunye" aria-labelledby="hero-title">
      <canvas class="stage" id="gl" aria-hidden="true"></canvas>
      <div class="loader" data-loader aria-hidden="true"><i></i><span>Yükleniyor</span></div>
      <div class="hero__inner" data-hero></div>
    </section>
    <section class="svc" id="hizmetler" aria-labelledby="svc-h"></section>
    <section class="about" id="hakkinda" aria-labelledby="about-h"></section>
    <section class="base" id="saatler" aria-labelledby="base-h"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-h"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-h"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
