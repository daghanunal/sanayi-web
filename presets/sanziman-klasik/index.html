<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111418" />
  <title>Şanzıman Tamiri | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111418'/%3E%3Cpath d='M16 5C16 5 8 15 8 21a8 8 0 0 0 16 0C24 15 16 5 16 5z' fill='%23d7193f'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pathway+Extreme:opsz,wdth,wght@8..144,75..100,400..900&family=Radio+Canada+Big:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="/img/sanziman-klasik/vites-secici.jpg" fetchpriority="high" />
</head>
<body>
  <header class="top" id="top"></header>

  <main>
    <!-- Künye. Arkada yağ çubuğu: açılışta şanzıman yağı bir kez MAX çizgisine kadar dolar (kaydırmaya bağlı değil). -->
    <section class="hero" id="kunye" aria-labelledby="hero-title">
      <img class="hero__img" src="/img/sanziman-klasik/vites-secici.jpg" alt="" fetchpriority="high" decoding="async" aria-hidden="true" />
      <div class="hero__shade" aria-hidden="true"></div>
      <div class="sivi" aria-hidden="true" data-oil>
        <svg class="sivi__wave sivi__wave--b" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q150 4 300 20 T600 20 T900 20 T1200 20 V40 H0Z"/></svg>
        <svg class="sivi__wave sivi__wave--a" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 22 Q150 38 300 22 T600 22 T900 22 T1200 22 V40 H0Z"/></svg>
        <div class="sivi__body"><span class="sivi__new"></span><span class="sivi__sheen"></span>
          <i class="bub"></i><i class="bub"></i><i class="bub"></i><i class="bub"></i><i class="bub"></i>
        </div>
      </div>
      <div class="stick" aria-hidden="true"><span class="stick__rod"></span><span class="stick__zone"></span><span class="stick__mark stick__mark--max mono">MAX</span><span class="stick__mark stick__mark--min mono">MIN</span></div>
      <div class="hero__copy" data-hero></div>
    </section>

    <section class="svcs" id="hizmetler" aria-labelledby="svc-h"></section>
    <section class="about" id="hakkinda" aria-labelledby="about-h"></section>
    <section class="konum" id="saatler" aria-labelledby="konum-h"></section>
    <section class="yorum" id="yorumlar" aria-labelledby="yorum-h"></section>
    <section class="final" id="iletisim" aria-labelledby="final-h"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
