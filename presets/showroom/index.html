  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <a class="skip" href="#hizmetler">İçeriğe geç</a>

  <header class="top" id="top"></header>

  <main>
    <!-- Künye: ad, iş, adres, bugünkü saatler; arkada kabin ışığı yansıyan siyah gövde. -->
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero__media">
        <img class="hero__img" src="/img/showroom/hero.jpg" alt="Boya kabininin tavan ışıkları siyah bir otomobilin parlak gövdesine yansıyor" fetchpriority="high" decoding="async" />
        <div class="hero__shade"></div>
        <div class="hero__sweep" aria-hidden="true"></div>
      </div>
      <div class="hero__content" id="kunye"></div>
    </section>

    <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="visit" id="saatler" aria-labelledby="visit-title"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    <section class="cta" id="iletisim" aria-labelledby="cta-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
