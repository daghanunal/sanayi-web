<body>
  <canvas class="stage" aria-hidden="true"></canvas>
  <div class="stage-shade" aria-hidden="true"></div>

  <header class="hdr" id="hdr"></header>

  <main>
    <!-- Künye; arkada tezgâh sahnesi (krank mili aynada döner). -->
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <!-- Hizmetler: her hizmete gelince sahne ilgili tezgâha geçer (krank taşlama, honlama, kafa planyası);
         kartın üstünde parçanın adı yazar. -->
    <section class="isler" id="hizmetler" aria-labelledby="isler-t"></section>
    <!-- Buradan sonra sahne kararır ve çizilmez; normal site bölümleri. -->
    <section class="hakkinda" id="hakkinda" aria-labelledby="hakkinda-t"></section>
    <section class="konum" id="saatler" aria-labelledby="konum-t"></section>
    <section class="yorumlar" id="yorumlar" aria-labelledby="yorum-t"></section>
    <section class="son" id="iletisim" aria-labelledby="son-t"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
