<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef6f9" />
  <meta name="description" content="" />
  <title>Oto Klima | Şaşmaz, Ankara</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2233'/%3E%3Cpath d='M16 5v22M6.5 10.5l19 11M6.5 21.5l19-11' stroke='%235fe3ff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wdth,wght@75..100,500..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Ubuntu+Sans+Mono:wght@500;600;700&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <!-- Arka plan: sıcak kabin rengi açılışta bir kez soğur. 3D klima devresi künyenin ve Hizmetler'in arkasında;
       Hizmetler'den sonra çizimi durur, gerisi düz site bölümleri. -->
  <div class="sky" aria-hidden="true"><i class="sky__cold"></i><i class="sky__hot" data-sky-hot></i><i class="sky__uv" data-sky-uv></i></div>
  <canvas class="stage" id="gl" aria-hidden="true"></canvas>
  <div class="tag" data-tag aria-hidden="true"><i></i><span data-tag-t></span></div>

  <header class="top" id="top"></header>

  <main>
    <div class="film" id="film">
      <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
      <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    </div>
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
