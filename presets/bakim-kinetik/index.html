<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eeece6" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%23121212%27/%3E%3Cpath d=%27M5 17h4v-4h4V9h4V5%27 fill=%27none%27 stroke=%27%23ff3d6e%27 stroke-width=%272.6%27/%3E%3C/svg%3E" />
    <title>Genel Bakım ve Onarım | Şaşmaz, Ankara</title>
    <meta name="description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400..900;1,700..900&family=Azeret+Mono:wght@500;700&display=swap"
    />

  <body>
    <header class="top" id="top"></header>

    <main>
      <!-- Künye: adın satırları kademe kademe içeri girer; kaydırınca satırlar zıt yönlere hafifçe kayar. -->
      <section class="hero" id="hero" aria-labelledby="hero-title"></section>
      <!-- Hizmetler: araç seçimi + dört grupta büyük tipografik dizin + iş listesi (WhatsApp mesajı). -->
      <section class="sec svc" id="hizmetler" aria-labelledby="svc-title"></section>
      <!-- Periyodik bakım: aralıklar merdiven gibi kademelenir; seçilen yakıta göre süzülür. -->
      <section class="sec plan" id="periyodik" aria-labelledby="plan-title"></section>
      <section class="band" id="band" aria-hidden="true"></section>
      <section class="sec flow" id="surec" aria-labelledby="flow-title"></section>
      <section class="sec about" id="hakkinda" aria-labelledby="about-title"></section>
      <section class="sec hours" id="saatler" aria-labelledby="hours-title"></section>
      <section class="sec quotes" id="yorumlar" aria-labelledby="quotes-title"></section>
      <section class="sec final" id="iletisim" aria-labelledby="final-title"></section>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
