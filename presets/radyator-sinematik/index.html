<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100a1d" />
  <title>Radyatör ve Soğutma | Şaşmaz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23100a1d'/%3E%3Cpath d='M16 5c4 6 7 9.6 7 13.4A7 7 0 0 1 9 18.4C9 14.6 12 11 16 5z' fill='%23ff3d7f'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Readex+Pro:wght@300..700&family=Reddit+Mono:wght@400..700&display=swap&subset=latin-ext" rel="stylesheet" />
</head>
<body>
  <!-- 3D: test havuzunun üstünde zincirle asılı radyatör. Künyenin arkasında durur; Hizmetler'de her hizmete gelince
       ilgili plan gösterilir (havuzda kaçak, hararet, petek, fan, antifriz akışı). -->
  <canvas class="stage" data-stage aria-hidden="true"></canvas>

  <header class="top" id="top"></header>

  <main>
    <section class="hero" id="kunye" aria-labelledby="hero-title"></section>
    <section class="services" id="hizmetler" aria-labelledby="services-title"></section>
    <!-- Buradan sonra 3D kararır; normal site bölümleri. -->
    <section class="about" id="hakkinda" aria-labelledby="about-title"></section>
    <section class="shop" id="saatler" aria-labelledby="shop-title"></section>
    <section class="reviews" id="yorumlar" aria-labelledby="reviews-title"></section>
    <section class="finale" id="iletisim" aria-labelledby="finale-title"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
